name: Offline tests and archived results

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          working-directory: agent
          cache-dependency-glob: agent/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Offline unit tests
        run: uv run --frozen python -m pytest tests -q
      - name: Scripted execution and audit smoke test
        if: ${{ !cancelled() }}
        run: uv run --frozen python -m scripts.offline_smoke
      - name: Validate the three experiment plans
        run: |
          uv run --frozen python -m scripts.run_batch configs/full_approve.json
          uv run --frozen python -m scripts.run_batch configs/full_escalate.json
          uv run --frozen python -m scripts.run_batch configs/hybrid.json
      - name: Recompute archived tables and check source hashes
        if: ${{ !cancelled() }}
        run: uv run --frozen python -m scripts.reproduce_results
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-verification
          path: |
            agent/runs/reproduction/verification.json
            agent/runs/reproduction/analyze_results.txt
            agent/runs/reproduction/verify_results.txt
          if-no-files-found: ignore
